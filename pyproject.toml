[project]
name = "jetbrains-vmoptions-tuner"
version = "1.0.0-RC2"
description = "WinUI 3 editor and automatic restorer for JetBrains .vmoptions files"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "winrt-runtime>=3.2.1,<4",
    "winrt-Windows.Foundation>=3.2.1,<4",
    "winrt-Windows.Foundation.Collections>=3.2.1,<4",
    "winrt-Windows.UI>=3.2.1,<4",
    "winrt-Windows.UI.Text>=3.2.1,<4",
    "winrt-Windows.UI.Xaml.Interop>=3.2.1,<4",
    "winui3-Microsoft.UI.Xaml>=3.2.1,<4",
    "winui3-Microsoft.UI.Xaml.Controls>=3.2.1,<4",
    "winui3-Microsoft.UI.Text>=3.2.1,<4",
    "winui3-Microsoft.UI.Xaml.Markup>=3.2.1,<4",
    "winui3-Microsoft.UI.Xaml.Media>=3.2.1,<4",
    "winui3-Microsoft.UI.Xaml.Media.Imaging>=3.2.1,<4",
    "winui3-Microsoft.UI.Xaml.XamlTypeInfo>=3.2.1,<4",
    "winui3-Microsoft.UI.Windowing>=3.2.1,<4",
    "winui3-Microsoft.Windows.ApplicationModel.DynamicDependency.Bootstrap>=3.2.1,<4",
]

[tool.setuptools.package-data]
jetbrains_vmoptions_tuner = ["main_window.xaml", "*.ps1", "assets/*.svg", "assets/*.ico", "assets/README.md"]

[tool.ruff]
line-length = 100
target-version = "py313"
